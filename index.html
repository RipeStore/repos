<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>RipeStore</title>
  <meta name="description" content="RipeStore - An alternative iOS app store for discovering and sideloading apps.">
  <meta name="keywords" content="iOS, App Store, RipeStore, alternative apps, sideloading">
  <meta name="author" content="RipeStore">
  <meta property="og:title" content="RipeStore">
  <meta property="og:description" content="An alternative iOS app store for discovering and sideloading apps.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ripestore.github.io/">
  <meta property="og:image" content="https://ripestore.github.io/icon-192.png">
  <meta property="og:site_name" content="RipeStore">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="RipeStore">
  <meta name="twitter:description" content="An alternative iOS app store for discovering and sideloading apps.">
  <meta name="twitter:image" content="https://ripestore.github.io/icon-192.png">
  <link rel="stylesheet" href="assets/css/style.css?v=8">
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2/dist/fuse.min.js" data-cfasync="false"></script>

  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/icon-96x96.png">
  <link rel="icon" type="image/png" sizes="144x144" href="/icon-144x144.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192x192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192x192.png">
</head>
<body>

  <div id="splash">
    <div class="splash-content">
      <div class="splash-logo">RipeStore</div>
      <div class="splash-loader"></div>
      <div id="splash-status">Initializing...</div>
    </div>
  </div>

  <nav class="navbar">
    <div class="nav-content">
      <div class="nav-brand">RipeStore</div>
      <div class="nav-search">
        <input type="text" id="search-input" placeholder="Search">
        <button id="search-clear" class="search-clear hidden" aria-label="Clear search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="nav-links">
        <a href="sources">Sources</a>
      </div>
    </div>
  </nav>

  <main>
    
    <!-- Featured Carousel -->
    <section id="featured-section" class="section hidden">
      <div class="section-header">
        <h2 class="section-title">Featured</h2>
        <a href="list?type=featured" class="view-all-link">View All</a>
      </div>
      <div class="carousel-container">
        <button class="scroll-btn left hidden" aria-label="Scroll left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div id="featured-grid" class="scroll-row"></div>
        <button class="scroll-btn right" aria-label="Scroll right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
    </section>

    <!-- News -->
    <section id="news-section" class="section hidden">
      <div class="section-header">
        <h2 class="section-title">Latest News</h2>
        <a href="list?type=news" class="view-all-link">View All</a>
      </div>
      <div class="carousel-container">
        <button class="scroll-btn left hidden" aria-label="Scroll left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div id="news-grid" class="scroll-row news-row"></div>
        <button class="scroll-btn right" aria-label="Scroll right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
    </section>

    <!-- App Grid -->
    <section class="section">
      <div class="section-header">
        <h2 class="section-title">Apps</h2>
        <div class="sort-picker">
          <select id="sort-select">
            <option value="relevance">Relevance</option>
            <option value="date-desc" selected>Newest</option>
            <option value="name-asc">Name (A-Z)</option>
            <option value="name-desc">Name (Z-A)</option>
            <option value="date-asc">Oldest</option>
          </select>
        </div>
      </div>
      <div id="app-grid" class="grid"></div>
    </section>
  </main>

  <script type="module" data-cfasync="false" src="assets/js/ui/home.js?v=8"></script>
</body>
</html>
